# Cloudflare Workers configuration
name = "unimem-sync"
main = ".output/server/index.mjs"
compatibility_date = "2026-08-09"
compatibility_flags = ["nodejs_compat"]

# Account configuration (set via wrangler CLI or environment)
# account_id = ""

# Workers Logs. Analytics failures are logged as structured JSON from
# utils/analytics.ts, which is only useful if logs are actually collected.
[observability]
enabled = true

[observability.logs]
head_sampling_rate = 1

# Environment variables
[vars]
SYNC_ENABLED = "true"

# Secrets - never set here. Provide with:
#   wrangler secret put NITRO_POSTHOG_KEY
#   wrangler secret put NITRO_OPENAI_API_KEY
#
# NITRO_SYNC_TOKENS is the allowlist of accepted sync tokens (comma-separated).
# Leaving it unset lets any token open its own vault, which is only safe on a
# server nobody else can reach - set it on anything internet-facing:
#   wrangler secret put NITRO_SYNC_TOKENS

# Production environment
[env.production]
name = "unimem-sync-prod"

# KV namespace backing the sync store - every vault lives here. Nitro mounts it
# as the `sync` storage namespace (see nitro.config.ts); without it the Worker
# falls back to memory and loses every vault when an isolate recycles.
#
# Create it once, then paste the id it prints:
#   wrangler kv namespace create SYNC_KV
[[kv_namespaces]]
binding = "SYNC_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# D1 Database (Cloudflare's SQLite)
# [[d1_databases]]
# binding = "DB"
# database_name = "unimem"
# database_id = ""

# Durable Objects (for real-time sync coordination)
# [[durable_objects.bindings]]
# name = "SYNC_COORDINATOR"
# class_name = "SyncCoordinator"

# R2 Storage (for file attachments)
# [[r2_buckets]]
# binding = "STORAGE"
# bucket_name = "unimem-files"

# Rate limiting
# [[rules]]
# type = "rate_limit"
# expression = "true"
# action = "log"
