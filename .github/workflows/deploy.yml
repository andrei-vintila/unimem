name: Deploy

on:
  # Auto-deploy to production on push to main
  push:
    branches: [main]

  # Manual trigger — pick what to deploy and where
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - server
          - web
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  DEPLOY_ENV: ${{ inputs.environment || 'production' }}

jobs:
  # ── Shared: build packages ─────────────────────────────────────────────────
  build-packages:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Upload packages dist
        uses: actions/upload-artifact@v4
        with:
          name: packages-dist-${{ github.run_id }}
          path: |
            packages/types/dist
            packages/core/dist
            packages/db/dist
          retention-days: 1

  # ── Deploy server (Cloudflare Workers) ────────────────────────────────────
  deploy-server:
    name: Deploy server → Cloudflare Workers
    runs-on: ubuntu-latest
    needs: build-packages
    if: ${{ inputs.service == 'all' || inputs.service == 'server' || github.event_name == 'push' }}
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore packages dist
        uses: actions/download-artifact@v4
        with:
          name: packages-dist-${{ github.run_id }}

      - name: Build server
        run: pnpm build:server

      - name: Deploy to Cloudflare Workers
        id: deploy
        working-directory: apps/server
        run: |
          if [ "$DEPLOY_ENV" = "production" ]; then
            npx wrangler deploy --env production
          else
            npx wrangler deploy
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Deploy web (Cloudflare Pages) ─────────────────────────────────────────
  deploy-web:
    name: Deploy web → Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build-packages
    if: ${{ inputs.service == 'all' || inputs.service == 'web' || github.event_name == 'push' }}
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore packages dist
        uses: actions/download-artifact@v4
        with:
          name: packages-dist-${{ github.run_id }}

      - name: Build web (static)
        run: pnpm --filter @unimem/web generate

      - name: Deploy to Cloudflare Pages
        id: deploy
        working-directory: apps/web
        run: |
          BRANCH_FLAG=""
          if [ "$DEPLOY_ENV" = "staging" ]; then
            BRANCH_FLAG="--branch staging"
          fi
          npx wrangler pages deploy .output/public \
            --project-name unimem-web \
            $BRANCH_FLAG
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
