name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel in-progress runs for the same PR or the same commit on a branch push.
# Using pull_request.number groups the push-event and pull_request-event for the
# same PR into one concurrency slot, preventing duplicate runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (required for typecheck)
        run: pnpm build:packages

      - name: Typecheck
        run: pnpm typecheck

  build-packages:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

  build-server:
    name: Build server
    runs-on: ubuntu-latest
    needs: build-packages
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Build server
        run: pnpm build:server

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-output
          path: apps/server/.output
          retention-days: 7

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    needs: build-packages
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Build web
        run: pnpm build:web

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-output
          path: apps/web/.output
          retention-days: 7

  build-obsidian:
    name: Build Obsidian plugin
    runs-on: ubuntu-latest
    needs: build-packages
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Build Obsidian plugin
        run: pnpm build:obsidian

      - name: Upload Obsidian plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-plugin
          path: |
            plugins/obsidian/main.js
            plugins/obsidian/manifest.json
          retention-days: 7
